<!-- SVG Placeholder for Electric Vehicle -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f3f4f6"/>
  
  <!-- Car silhouette -->
  <g transform="translate(100, 200)">
    <!-- Body -->
    <path d="M50 100 L150 50 L450 50 L550 100 L550 180 L50 180 Z" 
          fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
    
    <!-- Roof -->
    <path d="M150 50 L200 20 L400 20 L450 50" 
          fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
    
    <!-- Windows -->
    <rect x="180" y="30" width="80" height="30" fill="#e0e7ff" opacity="0.6"/>
    <rect x="340" y="30" width="80" height="30" fill="#e0e7ff" opacity="0.6"/>
    
    <!-- Wheels -->
    <circle cx="150" cy="180" r="40" fill="#374151" stroke="#1f2937" stroke-width="3"/>
    <circle cx="450" cy="180" r="40" fill="#374151" stroke="#1f2937" stroke-width="3"/>
    <circle cx="150" cy="180" r="20" fill="#6b7280"/>
    <circle cx="450" cy="180" r="20" fill="#6b7280"/>
    
    <!-- Lightning bolt (EV symbol) -->
    <path d="M320 80 L300 110 L315 110 L295 140 L325 105 L310 105 Z" 
          fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="32" 
        fill="#6b7280" text-anchor="middle">Electric Vehicle</text>
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="20" 
        fill="#9ca3af" text-anchor="middle">No image available</text>
</svg>
