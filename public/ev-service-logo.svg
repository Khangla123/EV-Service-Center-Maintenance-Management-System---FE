<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Modern Gradient Definitions -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lightningGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="120" cy="120" r="110" fill="url(#glowGradient)" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Main Background Circle -->
  <circle cx="120" cy="120" r="100" fill="url(#primaryGradient)" filter="url(#softShadow)"/>
  
  <!-- Decorative Ring -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#accentGradient)" stroke-width="3" opacity="0.5"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  
  <!-- Modern Electric Car Icon - Centered and Enlarged -->
  <g transform="translate(50, 65) scale(1.4)" filter="url(#softShadow)">
    <!-- Car Body - Sleek Modern Design -->
    <path d="M 5 30 Q 10 15 20 10 L 80 10 Q 90 15 95 30 L 100 40 L 0 40 Z" 
          fill="url(#accentGradient)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Car Lower Body -->
    <rect x="0" y="40" width="100" height="20" rx="3" 
          fill="url(#accentGradient)" stroke="#ffffff" stroke-width="2.5"/>
    
    <!-- Windshield - Modern Angular Design -->
    <path d="M 22 15 L 28 22 L 48 22 L 48 15 Z" 
          fill="#e0f2fe" opacity="0.9" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Side Window -->
    <path d="M 52 15 L 52 22 L 72 22 L 78 15 Z" 
          fill="#e0f2fe" opacity="0.9" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Front Light -->
    <ellipse cx="8" cy="35" rx="3" ry="2" fill="#fef3c7" opacity="0.9"/>
    
    <!-- Wheels - Modern Design -->
    <g>
      <!-- Front Wheel -->
      <circle cx="25" cy="60" r="10" fill="#1e293b" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="25" cy="60" r="6" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="25" cy="60" r="3" fill="#64748b"/>
      <!-- Wheel Spokes -->
      <line x1="25" y1="54" x2="25" y2="66" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="19" y1="60" x2="31" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
      
      <!-- Rear Wheel -->
      <circle cx="75" cy="60" r="10" fill="#1e293b" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="75" cy="60" r="6" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="75" cy="60" r="3" fill="#64748b"/>
      <!-- Wheel Spokes -->
      <line x1="75" y1="54" x2="75" y2="66" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="69" y1="60" x2="81" y2="60" stroke="#94a3b8" stroke-width="1.5"/>
    </g>
    
    <!-- Door Handle -->
    <rect x="55" y="32" width="12" height="2" rx="1" fill="#e0f2fe" opacity="0.7"/>
    
    <!-- Side Mirror -->
    <ellipse cx="18" cy="25" rx="3" ry="2" fill="#e0f2fe" opacity="0.8" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Lightning Bolt - Modern Sharp Design -->
  <g transform="translate(135, 85) scale(1.2)" filter="url(#glow)">
    <path d="M 0 0 L -8 15 L -3 15 L -10 30 L 5 10 L 0 10 Z" 
          fill="url(#lightningGradient)" 
          stroke="#f59e0b" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>
    <!-- Inner Highlight -->
    <path d="M -1 2 L -6 13 L -3 13 L -7 23 L 2 11 L -1 11 Z" 
          fill="#fef3c7" 
          opacity="0.6"/>
  </g>
  
  <!-- Modern "EV" Text with Style -->
  <g filter="url(#softShadow)">
    <text x="120" y="175" 
          font-family="'Segoe UI', -apple-system, system-ui, sans-serif" 
          font-size="32" 
          font-weight="900" 
          fill="#ffffff" 
          text-anchor="middle"
          letter-spacing="2">EV</text>
    <!-- Text Shadow for Depth -->
    <text x="120" y="175" 
          font-family="'Segoe UI', -apple-system, system-ui, sans-serif" 
          font-size="32" 
          font-weight="900" 
          fill="url(#accentGradient)" 
          text-anchor="middle"
          letter-spacing="2"
          opacity="0.3"
          transform="translate(0, 2)">EV</text>
  </g>
  
  <!-- Subtle Shine Effect on Circle -->
  <path d="M 60 60 Q 120 50 180 60" 
        stroke="#ffffff" 
        stroke-width="2" 
        fill="none" 
        opacity="0.2"
        stroke-linecap="round"/>
</svg>
